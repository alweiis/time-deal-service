name: TimeDeal Service CI

# 1. 동작 조건 (Trigger): main 브랜치에 Push 되거나 PR이 올라올 때 실행
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. 실행할 작업 (Jobs)
jobs:
  build-and-test:
    runs-on: ubuntu-latest # GitHub이 제공하는 가상 Linux 서버에서 실행

    # 테스트에 필요한 인프라(Redis, Kafka) 정의
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      zookeeper:
        image: bitnami/zookeeper:latest
        ports:
          - 2181:2181
        env:
          ALLOW_ANONYMOUS_LOGIN: yes
      kafka:
        image: bitnami/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
          ALLOW_PLAINTEXT_LISTENER: yes
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092

    steps:
      # Step 1: GitHub 저장소에서 코드 내려받기
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Java 17 환경 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # 가장 대중적인 OpenJDK 배포판

      # Step 3: Gradle 실행 권한 부여 (리눅스 환경 필수)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 4: 프로젝트 빌드 및 테스트 실행
      - name: Build and Test with Gradle
        run: ./gradlew clean build